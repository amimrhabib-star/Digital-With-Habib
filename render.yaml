# Deploy from your own private GitHub repository. Paid persistent disk required.
services:
  - type: web
    name: digital-with-habib
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npm run build
    startCommand: APP_ORIGIN=$RENDER_EXTERNAL_URL npm start
    healthCheckPath: /api/content
    disk:
      name: website-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: STORAGE_DIR
        value: /var/data
      - key: ADMIN_PASSWORD_HASH
        sync: false
